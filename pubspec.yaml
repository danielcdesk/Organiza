name: organiza
description: Organizador pessoal local-first para Windows e Android.
publish_to: none
version: 0.8.0+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.3
  cryptography: ^2.9.0
  sqlite3: ^3.5.2
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.0
  window_manager: ^0.5.2
  flutter_svg: ^2.0.17
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Keep the Android picker lifecycle bridge stable with this Flutter toolchain.
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true
  assets:
    - assets/branding/organiza-app-icon.png
    - assets/banks/
